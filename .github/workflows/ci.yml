name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    # Pinned: ubuntu-latest migrated to 26.04 mid-stream and broke the GTK/WebKit
    # build (see below). Pin to the LTS image the project is validated on.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Install the GTK/WebKit development headers explicitly. Do not rely on
          # libglib2.0-dev being pulled in transitively: on Ubuntu >= 26.04 it is a
          # metapackage and the GLib headers/.pc files move to libgio-2.0-dev.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev xvfb scrot

      - name: Install Node dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: xvfb-run -a npm test

      - name: Run app and capture screenshot
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" bash -c "
            node examples/electron-style-app.js &
            APP_PID=\$!
            sleep 2
            scrot adrenaline-window.png
            wait \$APP_PID || true
          "

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: adrenaline-window
          path: adrenaline-window.png
