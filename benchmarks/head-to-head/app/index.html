<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark Head-to-Head App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-window">
        <header class="app-header">
            <div class="brand">
                <span class="logo-icon">⚡</span>
                <h1>Productivity Bench Workload</h1>
            </div>
            <div class="metrics-bar">
                <div class="metric-badge">
                    <span class="label">IPC Messages:</span>
                    <span class="value" id="ipc-count">0</span>
                </div>
                <div class="metric-badge">
                    <span class="label">Active Rows:</span>
                    <span class="value" id="record-count">0</span>
                </div>
                <div class="metric-badge">
                    <span class="label">Last Render:</span>
                    <span class="value" id="render-time">0ms</span>
                </div>
            </div>
        </header>

        <main class="app-main">
            <div class="glass-panel controls-panel">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search 1,000+ records by name, role, department, or status..." />
                </div>
                <div class="action-buttons">
                    <button id="btn-sort-name" class="btn">Sort by Name</button>
                    <button id="btn-sort-value" class="btn">Sort by Value</button>
                    <button id="btn-shuffle" class="btn btn-primary">Shuffle Data</button>
                </div>
            </div>

            <div class="glass-panel table-panel">
                <div class="table-scroll-container">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th># ID</th>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Department</th>
                                <th>Status</th>
                                <th>Activity Metric</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Populated dynamically by app.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
